apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petdesk-etl-data
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: petdesk-etl
spec:
  schedule: '0 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: etl
              image: petdesk-etl:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: ETL_PAGE_SIZE
                  value: '100'
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: petdesk-etl-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: petdesk-etl-dry-run
spec:
  schedule: '0 * * * *'
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 10001
          containers:
            - name: etl
              image: petdesk-etl:latest
              imagePullPolicy: IfNotPresent
              args: ['python', '-m', 'etl', '--dry-run']
              env:
                - name: ETL_PAGE_SIZE
                  value: '100'
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
